<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethos Trust Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a2e;--border:#2a2a3e;
  --text:#e0e0ff;--text2:#8888aa;--accent:#00ff88;--accent2:#00cc6a;
  --red:#ff4466;--yellow:#ffaa00;--blue:#4488ff;--purple:#aa44ff;
  --glow:0 0 20px rgba(0,255,136,0.3);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:20px}

/* Header */
.header{text-align:center;padding:40px 20px 30px;position:relative}
.header::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:2px}
.logo{font-size:2.5em;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
.logo span{font-weight:300;opacity:0.7}
.subtitle{color:var(--text2);margin-top:8px;font-size:0.95em}

/* Search */
.search-box{max-width:700px;margin:30px auto;position:relative}
.search-box input{width:100%;padding:16px 60px 16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:1em;outline:none;transition:all 0.3s}
.search-box input:focus{border-color:var(--accent);box-shadow:var(--glow)}
.search-box input::placeholder{color:var(--text2)}
.search-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2em;transition:all 0.3s}
.search-btn:hover{transform:translateY(-50%) scale(1.05);box-shadow:var(--glow)}
.search-hints{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.hint{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:0.8em;color:var(--text2);cursor:pointer;transition:all 0.2s}
.hint:hover{border-color:var(--accent);color:var(--accent)}

/* Stats Banner */
.stats-banner{display:flex;gap:16px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 24px;text-align:center;min-width:140px;transition:all 0.3s}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat-val{font-size:1.8em;font-weight:700;color:var(--accent)}
.stat-label{font-size:0.75em;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:1px}

/* Loading */
.loading{text-align:center;padding:60px 20px;display:none}
.loading.show{display:block}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Profile Card */
.profile-section{display:none}
.profile-section.show{display:block}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px;margin-bottom:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:2em;background:var(--surface2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:200px}
.profile-name{font-size:1.6em;font-weight:700}
.profile-handle{color:var(--text2);margin-top:4px}
.profile-meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.meta-item{font-size:0.85em;color:var(--text2)}
.meta-item strong{color:var(--text)}
.score-display{text-align:center;min-width:120px}
.score-ring{position:relative;width:100px;height:100px;margin:0 auto}
.score-ring svg{transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:6}
.score-ring .bg{stroke:var(--border)}
.score-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.score-number{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6em;font-weight:800}
.score-label{font-size:0.75em;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:6px}
.level-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:0.75em;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:6px}
.level-distinguished{background:rgba(0,255,136,0.15);color:var(--accent)}
.level-reputable{background:rgba(68,136,255,0.15);color:var(--blue)}
.level-established{background:rgba(170,68,255,0.15);color:var(--purple)}
.level-known{background:rgba(255,170,0,0.15);color:var(--yellow)}
.level-marginal{background:rgba(255,68,102,0.15);color:var(--red)}

/* XP & Influence */
.xp-bar{margin-top:12px;background:var(--surface2);border-radius:8px;padding:10px 14px;display:flex;gap:20px;flex-wrap:wrap}
.xp-item{font-size:0.8em}
.xp-item span{color:var(--accent);font-weight:700}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border-radius:12px;padding:4px;border:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 20px;border-radius:8px;cursor:pointer;font-size:0.9em;color:var(--text2);transition:all 0.2s;white-space:nowrap;border:none;background:none}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:var(--bg);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}

/* Activity Cards */
.activity-list{display:flex;flex-direction:column;gap:12px}
.activity-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;transition:all 0.2s}
.activity-card:hover{border-color:var(--accent);transform:translateX(4px)}
.activity-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.activity-type{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:0.75em;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.type-review{background:rgba(0,255,136,0.15);color:var(--accent)}
.type-vouch{background:rgba(68,136,255,0.15);color:var(--blue)}
.type-unvouch{background:rgba(255,68,102,0.15);color:var(--red)}
.type-slash{background:rgba(255,68,102,0.15);color:var(--red)}
.type-reply{background:rgba(170,68,255,0.15);color:var(--purple)}
.type-vote{background:rgba(255,170,0,0.15);color:var(--yellow)}
.type-other{background:rgba(136,136,170,0.15);color:var(--text2)}
.activity-time{font-size:0.8em;color:var(--text2)}
.activity-body{color:var(--text);line-height:1.6;font-size:0.95em}
.activity-body p{margin-bottom:6px}
.activity-footer{display:flex;gap:16px;margin-top:10px;font-size:0.8em;color:var(--text2)}
.activity-footer span{display:flex;align-items:center;gap:4px}

/* Sentiment */
.sentiment{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:0.75em;font-weight:600}
.sentiment-positive{background:rgba(0,255,136,0.15);color:var(--accent)}
.sentiment-negative{background:rgba(255,68,102,0.15);color:var(--red)}
.sentiment-neutral{background:rgba(255,170,0,0.15);color:var(--yellow)}

/* Summary Card */
.summary-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:14px;padding:24px;line-height:1.7}
.summary-card h3{color:var(--accent);margin-bottom:12px;font-size:1.1em}
.summary-card p{color:var(--text);font-size:0.95em}
.summary-authors{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.author-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:0.8em;color:var(--text2)}

/* Empty State */
.empty{text-align:center;padding:40px;color:var(--text2)}
.empty-icon{font-size:3em;margin-bottom:12px;opacity:0.5}

/* Error */
.error-msg{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.3);border-radius:12px;padding:16px 20px;color:var(--red);text-align:center;display:none}
.error-msg.show{display:block}

/* Footer */
.footer{text-align:center;padding:40px 20px;color:var(--text2);font-size:0.8em}
.footer a{color:var(--accent)}

/* Charts */
.chart-section{margin-bottom:24px}
.chart-title{font-size:1.1em;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.chart-container{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative}
.chart-container canvas{width:100%!important;height:auto!important;display:block}
.chart-tooltip{position:absolute;background:var(--surface2);border:1px solid var(--accent);border-radius:8px;padding:6px 12px;font-size:0.8em;color:var(--text);pointer-events:none;display:none;z-index:10;white-space:nowrap;box-shadow:var(--glow)}
.chart-legend{display:flex;gap:16px;margin-top:12px;justify-content:center;flex-wrap:wrap;font-size:0.8em;color:var(--text2)}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart-stats{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.chart-stat{background:var(--surface2);border-radius:8px;padding:8px 14px;text-align:center}
.chart-stat .val{font-size:1.1em;font-weight:700;color:var(--accent)}
.chart-stat .lbl{font-size:0.7em;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}

/* Responsive */
@media(max-width:600px){
  .logo{font-size:1.8em}
  .profile-card{flex-direction:column;text-align:center}
  .score-display{min-width:auto}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{padding:8px 14px;font-size:0.8em}
  .chart-container{padding:12px}
  .chart-stats{gap:8px}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">Ethos <span>Trust Dashboard</span></div>
    <p class="subtitle">Explore reputation & trust on the Ethos Network</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Enter wallet address, Twitter handle, or profile ID..." autocomplete="off">
    <button class="search-btn" onclick="doSearch()" title="Search">&#128269;</button>
  </div>
  <div class="search-hints">
    <span class="hint" onclick="fillSearch('VitalikButerin')">@VitalikButerin</span>
    <span class="hint" onclick="fillSearch('0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045')">vitalik.eth</span>
    <span class="hint" onclick="fillSearch('profileId:1')">Profile #1 (Ethos)</span>
    <span class="hint" onclick="fillSearch('profileId:10')">Profile #10</span>
  </div>

  <div id="systemStats" class="stats-banner"></div>
  <div id="errorMsg" class="error-msg"></div>
  <div id="loading" class="loading"><div class="spinner"></div><p>Fetching data from Ethos Network...</p></div>

  <div id="profileSection" class="profile-section">
    <div id="profileCard" class="profile-card"></div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="activities">Activities</button>
      <button class="tab" data-tab="reviews">Reviews</button>
      <button class="tab" data-tab="vouches">Vouches</button>
      <button class="tab" data-tab="charts">&#128200; Charts</button>
      <button class="tab" data-tab="summary">AI Summary</button>
    </div>

    <div id="tab-activities" class="tab-content active"></div>
    <div id="tab-reviews" class="tab-content"></div>
    <div id="tab-vouches" class="tab-content"></div>
    <div id="tab-charts" class="tab-content"></div>
    <div id="tab-summary" class="tab-content"></div>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://developers.ethos.network/" target="_blank">Ethos Network API v2</a> &middot; Built with &#10084;
</div>

<script>
const BASE = 'https://api.ethos.network/api/v2';
const CLIENT = 'ethos-trust-dashboard@1.0.0';
const hdrs = { 'X-Ethos-Client': CLIENT, 'Content-Type': 'application/json' };

// --- API helpers ---
async function apiGet(path) {
  const res = await fetch(BASE + path, { headers: hdrs });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ message: res.statusText }));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(BASE + path, {
    method: 'POST',
    headers: hdrs,
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ message: res.statusText }));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.add('show'); }
function hide(id) { $(id).classList.remove('show'); }

function timeAgo(dateStr) {
  if (!dateStr) return '';
  // Handle Unix timestamps (seconds) and ISO strings
  const ts = typeof dateStr === 'number' ? dateStr * 1000 : new Date(dateStr).getTime();
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return new Date(dateStr).toLocaleDateString();
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function truncate(s, len = 300) {
  if (!s) return '';
  return s.length > len ? s.slice(0, len) + '...' : s;
}

// --- Get best userkey from user object ---
function bestUserkey(user) {
  // Prefer profileId
  if (user.profileId) return `profileId:${user.profileId}`;
  // Then look in userkeys array for a usable format
  if (user.userkeys && user.userkeys.length > 0) {
    // Prefer address, then service:x.com:<id>, then any
    const addr = user.userkeys.find(k => k.startsWith('address:'));
    if (addr) return addr;
    const xId = user.userkeys.find(k => /^service:x\.com:\d+$/.test(k));
    if (xId) return xId;
    return user.userkeys[0];
  }
  return null;
}

// --- Resolve userkey from input ---
async function resolveUser(input) {
  input = input.trim();

  // Already a userkey format
  if (input.startsWith('profileId:')) {
    const pid = input.split(':')[1];
    const user = await apiGet(`/user/by/profile-id/${pid}`);
    return { user, userkey: bestUserkey(user) || input };
  }
  if (input.startsWith('address:')) {
    const addr = input.split(':')[1];
    const user = await apiGet(`/user/by/address/${addr}`);
    return { user, userkey: bestUserkey(user) || input };
  }
  if (input.startsWith('service:')) {
    const parts = input.split(':');
    if (parts[2] === 'username') {
      const user = await apiGet(`/user/by/x/${parts[3]}`);
      return { user, userkey: bestUserkey(user) || input };
    }
    return { user: null, userkey: input };
  }

  // Auto-detect
  if (/^0x[a-fA-F0-9]{40}$/.test(input)) {
    const user = await apiGet(`/user/by/address/${input}`);
    return { user, userkey: bestUserkey(user) || `address:${input}` };
  }
  if (/^\d+$/.test(input)) {
    const user = await apiGet(`/user/by/profile-id/${input}`);
    return { user, userkey: bestUserkey(user) || `profileId:${input}` };
  }
  // Assume Twitter username
  const username = input.replace(/^@/, '');
  const user = await apiGet(`/user/by/x/${username}`);
  return { user, userkey: bestUserkey(user) || `service:x.com:username:${username}` };
}

// --- Score Ring ---
function scoreRing(score, level) {
  const maxScore = 2800;
  const pct = Math.min(score / maxScore, 1);
  const circ = 2 * Math.PI * 42;
  const offset = circ * (1 - pct);
  const color = score >= 1600 ? 'var(--accent)' : score >= 800 ? 'var(--yellow)' : 'var(--red)';
  const levelCls = {
    'distinguished': 'level-distinguished',
    'reputable': 'level-reputable',
    'established': 'level-established',
    'known': 'level-known',
    'marginal': 'level-marginal'
  }[level] || 'level-other';

  return `
    <div class="score-ring">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="42"/>
        <circle class="fg" cx="50" cy="50" r="42"
          stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="score-number" style="color:${color}">${score.toLocaleString()}</div>
    </div>
    <div class="score-label">Trust Score</div>
    ${level ? `<span class="level-badge ${levelCls}">${escHtml(level)}</span>` : ''}`;
}

// --- Type badge ---
function typeBadge(type) {
  const t = (type || '').toLowerCase();
  let cls = 'type-other', icon = '&#9679;';
  if (t.includes('review')) { cls = 'type-review'; icon = '&#9733;'; }
  else if (t === 'vouch' || t === 'vouch-v2') { cls = 'type-vouch'; icon = '&#10003;'; }
  else if (t === 'unvouch' || t === 'unvouch-v2') { cls = 'type-unvouch'; icon = '&#10007;'; }
  else if (t.includes('slash')) { cls = 'type-slash'; icon = '&#9888;'; }
  else if (t.includes('reply')) { cls = 'type-reply'; icon = '&#8618;'; }
  else if (t.includes('vote')) { cls = 'type-vote'; icon = '&#9650;'; }
  return `<span class="activity-type ${cls}">${icon} ${escHtml(type)}</span>`;
}

// --- Sentiment badge ---
function sentimentBadge(s) {
  if (!s) return '';
  const sl = String(s).toLowerCase();
  const cls = sl === 'positive' ? 'sentiment-positive' : sl === 'negative' ? 'sentiment-negative' : 'sentiment-neutral';
  const icon = sl === 'positive' ? '&#10003;' : sl === 'negative' ? '&#10007;' : '&#9679;';
  return `<span class="sentiment ${cls}">${icon} ${escHtml(s)}</span>`;
}

// --- Fill search ---
function fillSearch(val) {
  $('searchInput').value = val;
  doSearch();
}

// --- Tab switching ---
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  $(`tab-${tab.dataset.tab}`).classList.add('active');
});

// --- Main Search ---
async function doSearch() {
  const raw = $('searchInput').value.trim();
  if (!raw) return;

  hide('profileSection');
  hide('errorMsg');
  $('systemStats').innerHTML = '';
  show('loading');

  try {
    const { user, userkey } = await resolveUser(raw);

    // Parallel: score + activities + reviews + vouches
    const [score, activities, reviews, vouches] = await Promise.all([
      apiGet(`/score/userkey?userkey=${encodeURIComponent(userkey)}`).catch(() => null),
      apiPost('/activities/profile/all', { userkey, limit: 30 }).catch(() => ({ values: [] })),
      apiPost('/activities/profile/received', { userkey, filter: ['review'], limit: 20 }).catch(() => ({ values: [] })),
      apiPost('/activities/profile/received', { userkey, filter: ['vouch', 'vouch-v2'], limit: 20 }).catch(() => ({ values: [] })),
    ]);

    hide('loading');

    // Profile Card
    renderProfile(user, score);
    show('profileSection');

    // Activities tab
    renderActivities(activities.values || []);

    // Reviews tab
    renderReviews(reviews.values || []);

    // Vouches tab
    renderVouches(vouches.values || []);

    // AI Summary tab
    loadSummary(userkey);

    // Charts tab
    loadScoreHistory(userkey);
    loadScoreDistribution();

  } catch (err) {
    hide('loading');
    $('errorMsg').textContent = err.message;
    show('errorMsg');
  }
}

// --- Render Profile ---
function renderProfile(user, scoreData) {
  const name = user?.displayName || user?.username || 'Unknown';
  const username = user?.username ? `@${user.username}` : '';
  const avatarUrl = user?.avatarUrl || '';
  const profileId = user?.profileId || '—';
  const status = user?.status || '';
  const xpTotal = user?.xpTotal || 0;
  const influence = user?.influenceFactor || 0;
  const influencePct = user?.influenceFactorPercentile || 0;
  const score = scoreData?.score ?? user?.score ?? 0;
  const level = scoreData?.level || '';

  let avatarHtml = avatarUrl
    ? `<img src="${escHtml(avatarUrl)}" alt="${escHtml(name)}" onerror="this.parentElement.innerHTML='&#128100;'">`
    : '&#128100;';

  $('profileCard').innerHTML = `
    <div class="avatar">${avatarHtml}</div>
    <div class="profile-info">
      <div class="profile-name">${escHtml(name)}</div>
      ${username ? `<div class="profile-handle">${escHtml(username)}</div>` : ''}
      <div class="profile-meta">
        <span class="meta-item"><strong>ID:</strong> #${escHtml(String(profileId))}</span>
        ${status ? `<span class="meta-item"><strong>Status:</strong> ${escHtml(status)}</span>` : ''}
      </div>
      <div class="xp-bar">
        <div class="xp-item">XP: <span>${xpTotal.toLocaleString()}</span></div>
        <div class="xp-item">Influence: <span>${influence}</span> (top ${100 - influencePct}%)</div>
      </div>
    </div>
    <div class="score-display">${scoreRing(score, level)}</div>`;
}

// --- Render Activities ---
function renderActivities(items) {
  const el = $('tab-activities');

    return;

    const a = item.data || item;

    const content = a.comment || a.content || a.description || '';
    return `

  }).join('')}</div>`;
}

// --- Score History Chart ---
async function loadScoreHistory(userkey) {
  try {
    const data = await apiGet(`/score/history?userkey=${encodeURIComponent(userkey)}&days=90`);
    if (!data || !data.length) return;
    renderScoreHistory(data);
  } catch { /* ignore */ }
}

function renderScoreHistory(data) {
  const el = $('tab-charts');
  // Build charts HTML
  let html = `<div class="chart-section">
    <div class="chart-title">&#128200; Score History (90 Days)</div>
    <div class="chart-container">
      <canvas id="scoreHistoryCanvas" width="800" height="300"></canvas>
      <div id="scoreHistoryTooltip" class="chart-tooltip"></div>
    </div>`;

  // Stats
  const scores = data.map(d => d.score);
  const minS = Math.min(...scores);
  const maxS = Math.max(...scores);
  const avgS = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  const change = scores[scores.length - 1] - scores[0];
  const changeStr = change >= 0 ? `+${change}` : `${change}`;
  const changeColor = change >= 0 ? 'var(--accent)' : 'var(--red)';

  html += `<div class="chart-stats">
    <div class="chart-stat"><div class="val">${scores[scores.length - 1].toLocaleString()}</div><div class="lbl">Current</div></div>
    <div class="chart-stat"><div class="val">${maxS.toLocaleString()}</div><div class="lbl">High</div></div>
    <div class="chart-stat"><div class="val">${minS.toLocaleString()}</div><div class="lbl">Low</div></div>
    <div class="chart-stat"><div class="val">${avgS.toLocaleString()}</div><div class="lbl">Average</div></div>
    <div class="chart-stat"><div class="val" style="color:${changeColor}">${changeStr}</div><div class="lbl">Change</div></div>
  </div></div>`;

  // Add distribution placeholder
  html += `<div id="distChartWrap"></div>`;
  el.innerHTML = html;

  // Draw the chart
  setTimeout(() => drawLineChart(data), 50);
}

function drawLineChart(data) {
  const canvas = document.getElementById('scoreHistoryCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 800, H = 300;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const pad = { top: 20, right: 20, bottom: 40, left: 60 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  const scores = data.map(d => d.score);
  const dates = data.map(d => new Date(d.date));
  const minS = Math.min(...scores) - 10;
  const maxS = Math.max(...scores) + 10;
  const range = maxS - minS || 1;

  // Grid lines
  ctx.strokeStyle = 'rgba(42,42,62,0.6)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
    // Y labels
    const val = Math.round(maxS - (range / 4) * i);
    ctx.fillStyle = '#8888aa';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toLocaleString(), pad.left - 8, y + 4);
  }

  // X labels
  ctx.fillStyle = '#8888aa';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(data.length / 6));
  for (let i = 0; i < data.length; i += step) {
    const x = pad.left + (i / (data.length - 1)) * cw;
    const d = dates[i];
    ctx.fillText(`${d.getMonth() + 1}/${d.getDate()}`, x, H - pad.bottom + 20);
  }

  // Line gradient
  const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + ch);
  grad.addColorStop(0, 'rgba(0,255,136,0.3)');
  grad.addColorStop(1, 'rgba(0,255,136,0.01)');

  // Area fill
  ctx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = pad.left + (i / (data.length - 1)) * cw;
    const y = pad.top + ch - ((scores[i] - minS) / range) * ch;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(pad.left + cw, pad.top + ch);
  ctx.lineTo(pad.left, pad.top + ch);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  for (let i = 0; i < data.length; i++) {
    const x = pad.left + (i / (data.length - 1)) * cw;
    const y = pad.top + ch - ((scores[i] - minS) / range) * ch;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Data points
  for (let i = 0; i < data.length; i++) {
    const x = pad.left + (i / (data.length - 1)) * cw;
    const y = pad.top + ch - ((scores[i] - minS) / range) * ch;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff88';
    ctx.fill();
  }

  // Hover interaction
  const tooltip = document.getElementById('scoreHistoryTooltip');
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.round(((mx - pad.left) / cw) * (data.length - 1));
    if (idx < 0 || idx >= data.length) { tooltip.style.display = 'none'; return; }
    const x = pad.left + (idx / (data.length - 1)) * cw;
    const y = pad.top + ch - ((scores[idx] - minS) / range) * ch;
    const d = dates[idx];
    tooltip.innerHTML = `<strong>${d.toLocaleDateString()}</strong><br>Score: <strong>${scores[idx].toLocaleString()}</strong>`;
    tooltip.style.display = 'block';
    const canvasRect = canvas.getBoundingClientRect();
    const tx = (x / W) * canvasRect.width;
    const ty = (y / H) * canvasRect.height;
    tooltip.style.left = (tx + 10) + 'px';
    tooltip.style.top = (ty - 40) + 'px';
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

async function loadScoreDistribution() {

function renderScoreDistribution(data) {
  const el = document.getElementById('distChartWrap');
  if (!el) return;

  const dist = data.distribution;
  const total = data.totals?.totalUsers || 0;

  let html = `<div class="chart-section">
    <div class="chart-title">&#127760; Score Distribution (All Network)</div>
    <div class="chart-container">
      <canvas id="distCanvas" width="800" height="320"></canvas>
      <div id="distTooltip" class="chart-tooltip"></div>
    </div>
    <div class="chart-stats">
      <div class="chart-stat"><div class="val">${total.toLocaleString()}</div><div class="lbl">Total Users</div></div>
      <div class="chart-stat"><div class="val">${(data.totals?.totalProfiles || 0).toLocaleString()}</div><div class="lbl">Profiles</div></div>
    </div>
  </div>`;
  el.innerHTML = html;

  setTimeout(() => drawBarChart(dist), 50);
}

function drawBarChart(dist) {
  const canvas = document.getElementById('distCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 800, H = 320;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const pad = { top: 20, right: 20, bottom: 60, left: 70 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  // Log scale for better visibility (huge gap between neutral and others)
  const totals = dist.map(d => d.profileCount + d.nonProfileCount);
  const maxTotal = Math.max(...totals);
  const barW = cw / dist.length * 0.7;
  const gap = cw / dist.length * 0.3;

  // Level colors
  const levelColors = {
    untrusted: '#ff4466', questionable: '#ff6644', neutral: '#ffaa00',
    known: '#4488ff', established: '#aa44ff', reputable: '#00cc6a',
    exemplary: '#00ff88', distinguished: '#00ffaa', revered: '#00ffdd', renowned: '#ffffff'
  };

  // Grid
  ctx.strokeStyle = 'rgba(42,42,62,0.6)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(W - pad.right, y);
    ctx.stroke();
    const val = Math.round(maxTotal * (1 - i / 4));
    ctx.fillStyle = '#8888aa';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toLocaleString(), pad.left - 8, y + 4);
  }

  // Bars
  const barData = [];
  for (let i = 0; i < dist.length; i++) {
    const d = dist[i];
    const total = d.profileCount + d.nonProfileCount;
    if (total === 0) continue;
    const x = pad.left + (i / dist.length) * cw + gap / 2;
    const barH = (total / maxTotal) * ch;
    const y = pad.top + ch - barH;
    const color = levelColors[d.level] || '#8888aa';

    // Gradient bar
    const grad = ctx.createLinearGradient(x, y, x, pad.top + ch);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color + '44');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, [4, 4, 0, 0]);
    ctx.fill();

    // Glow effect
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Profile count overlay (smaller lighter bar)
    if (d.profileCount > 0) {
      const profH = (d.profileCount / maxTotal) * ch;
      const profY = pad.top + ch - profH;
      ctx.fillStyle = '#ffffff33';
      ctx.beginPath();
      ctx.roundRect(x, profY, barW, profH, [4, 4, 0, 0]);
      ctx.fill();
    }

    // X label
    ctx.save();
    ctx.translate(x + barW / 2, H - pad.bottom + 10);
    ctx.rotate(-Math.PI / 6);
    ctx.fillStyle = '#8888aa';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(d.level, 0, 0);
    ctx.restore();

    barData.push({ x, y, w: barW, h: barH, d, color });
  }

  // Legend
  ctx.fillStyle = '#8888aa';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'left';
  const lx = pad.left;
  const ly = H - 8;
  ctx.fillStyle = '#ffffff33';
  ctx.fillRect(lx, ly - 8, 10, 10);
  ctx.fillStyle = '#8888aa';
  ctx.fillText('Profiles', lx + 14, ly);
  ctx.fillStyle = '#00ff8866';
  ctx.fillRect(lx + 80, ly - 8, 10, 10);
  ctx.fillStyle = '#8888aa';
  ctx.fillText('All Users', lx + 94, ly);

  // Hover
  const tooltip = document.getElementById('distTooltip');
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    let found = null;
    for (const bd of barData) {
      if (mx >= bd.x && mx <= bd.x + bd.w && my >= bd.y && my <= bd.y + bd.h) {
        found = bd;
        break;
      }
    }
    if (!found) { tooltip.style.display = 'none'; return; }
    const d = found.d;
    const total = d.profileCount + d.nonProfileCount;
    tooltip.innerHTML = `<strong>${d.level}</strong><br>Total: ${total.toLocaleString()}<br>Profiles: ${d.profileCount.toLocaleString()}<br>Non-profiles: ${d.nonProfileCount.toLocaleString()}`;
    tooltip.style.display = 'block';
    const canvasRect = canvas.getBoundingClientRect();
    const tx = (e.clientX - canvasRect.left) + 10;
    const ty = (e.clientY - canvasRect.top) - 40;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}

// --- System Stats (from score distribution) ---
async function loadStats() {
  try {
    const data = await apiGet('/stats/score-distribution');
    if (data && data.distribution) {
      const dist = data.distribution;
      const total = dist.reduce((s, d) => s + (d.profileCount || 0) + (d.nonProfileCount || 0), 0);
      const get = level => dist.find(d => d.level === level);
      const distLevel = get('distinguished');
      const repLevel = get('reputable');
      const estLevel = get('established');
      $('systemStats').innerHTML = `
        <div class="stat-card"><div class="stat-val">${total.toLocaleString()}</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-val">${((distLevel?.profileCount || 0) + (distLevel?.nonProfileCount || 0)).toLocaleString()}</div><div class="stat-label">Distinguished</div></div>
        <div class="stat-card"><div class="stat-val">${((repLevel?.profileCount || 0) + (repLevel?.nonProfileCount || 0)).toLocaleString()}</div><div class="stat-label">Reputable</div></div>
        <div class="stat-card"><div class="stat-val">${((estLevel?.profileCount || 0) + (estLevel?.nonProfileCount || 0)).toLocaleString()}</div><div class="stat-label">Established</div></div>`;
    }
  } catch { /* ignore */ }
}
